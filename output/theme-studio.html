  const presets = [
    { id:'paper', name:'原初 · 暖金', description:'米白纸色 · 暖金点缀', bg:'#F5F1E7', panel:'#E2E8DF', accent:'#B98A43', header:'portrait', player:'portrait', sidebar:'stage', dialog:'portrait', mask:80, blur:0, position:'center', builtin:true },
    { id:'celadon', name:'山色 · 青瓷', description:'浅青底色 · 山色入画', bg:'#EAF1EA', panel:'#D8E5DC', accent:'#457A68', header:'mountain', player:'mountain', sidebar:'mountain', dialog:'mountain', mask:82, blur:0, position:'center', builtin:true },
    { id:'night', name:'琉璃 · 夜色', description:'深蓝底色 · 冰蓝点缀', bg:'#101F2E', panel:'#1D3447', accent:'#8CC7DE', header:'stage', player:'stage', sidebar:'stage', dialog:'stage', mask:83, blur:2, position:'center', builtin:true },
  ];
  const design = { radius:15, buttonRadius:12 };
  const state = { screen:'player', track:0, position:91, playing:true, playerLyrics:false, playMode:0, listTab:'preset', selected:'paper', applied:'paper', appliedSnapshot:null, custom:[], scene:'library', editTab:'colors', place:'header', draft:null, editId:null, dialog:null, first:true };
  const sceneNames = {library:'曲库',player:'播放',lyrics:'歌词',sidebar:'侧栏',dialog:'弹窗'};
  const placeNames = {header:'首页顶部',player:'播放 / 歌词',sidebar:'侧栏',dialog:'弹窗顶部'};
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const escape = str => String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (action,label,cls='',other='') => `<button type="button" class="xy-button cursor-interaction ${cls}" data-action="${action}" ${other}>${label}</button>`;
  const iconButton = (action,name,label,extra='') => `<button type="button" class="xy-icon cursor-interaction" data-action="${action}" aria-label="${label}" ${extra}>${icon(name)}</button>`;
  const allThemes = () => [...presets,...state.custom];
  const getTheme = id => allThemes().find(t=>t.id===id) || presets[0];
  const activeTheme = () => state.appliedSnapshot || getTheme(state.applied);
  const themeSignature = t => JSON.stringify(['bg','panel','accent','header','player','sidebar','dialog','mask','blur','position'].map(k=>t[k]));
  const isApplied = t => state.applied===t.id && themeSignature(t)===themeSignature(activeTheme());
  const luminance = color => { const c=color.replace('#','').match(/.{2}/g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
  const contrast = (a,b) => (Math.max(luminance(a),luminance(b))+.05)/(Math.min(luminance(a),luminance(b))+.05);
  function mix(a,b,p){const ac=a.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));const bc=b.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));return '#'+ac.map((v,i)=>Math.round(v*(1-p)+bc[i]*p).toString(16).padStart(2,'0')).join('');}
  function themeStyle(t){
    const ink=contrast(t.bg,'#20373A')>=contrast(t.bg,'#ECF2F1')?'#20373A':'#ECF2F1';
    const panelInk=contrast(t.panel,'#20373A')>=contrast(t.panel,'#ECF2F1')?'#20373A':'#ECF2F1';
    const muted=mix(ink,t.bg,.30);
    let accentText=t.accent;
    for(let i=0;i<12 && contrast(accentText,t.bg)<4.5;i++) accentText=mix(accentText,ink,.18);
    const onAccent=contrast(t.accent,'#FFFFFF')>=contrast(t.accent,'#15272A')?'#FFFFFF':'#15272A';
    return `--xy-bg:${t.bg};--xy-panel:${t.panel};--xy-ink:${ink};--xy-panel-ink:${panelInk};--xy-panel-muted:${mix(panelInk,t.panel,.3)};--xy-muted:${muted};--xy-line:${mix(ink,t.bg,.82)};--xy-accent:${t.accent};--xy-accent-text:${accentText};--xy-on-accent:${onAccent};--xy-mask:${t.mask/100};--xy-blur:${t.blur}px;--xy-image-position:${t.position==='left'?'25% 40%':t.position==='right'?'80% 40%':'60% 40%'};color-scheme:${luminance(t.bg)>.38?'light':'dark'};`;
  }
  function imageTag(key, cls='', alt=''){return assets[key]?`<img class="${cls}" src="${assets[key]}" alt="${alt}">`:'';}
  const palette = t => `<div class="xy-palette" aria-label="主题配色"><span style="background:${t.bg}"></span><span style="background:${t.panel}"></span><span style="background:${t.accent}"></span></div>`;
  function artBackdrop(t,place){return `<div class="xy-scene-bg" aria-hidden="true" style="filter:blur(${t.blur}px)">${imageTag(t[place])}</div><div class="xy-scene-veil"></div><div class="xy-readable-scrim"></div>`;}

  function togglePlayback(target,p){p.playing=!p.playing;target.querySelector('.xy-record')?.classList.toggle('xy-record-paused',!p.playing);const btn=target.querySelector('[data-action="toggle-play"]');if(btn){btn.innerHTML=icon(p.playing?'pause':'play');btn.setAttribute('aria-label',p.playing?'暂停':'播放');}refreshIcons();}
  function updateSeek(input,p,target){p.position=Number(input.value);input.style.setProperty('--xy-progress',p.position/duration(p)*100+'%');target.querySelector('.xy-elapsed').textContent=formatTime(p.position);}
  function mountCoverVariant(){
    const target=document.getElementById('xy-cover-studio');
    const device=target.querySelector('.xy-device');
    const content=target.querySelector('.xy-cover-view');
    const sheet=target.querySelector('.xy-cover-overlay');
    const p={screen:'player',themeId:'paper',track:0,position:91,playing:true,playerLyrics:false,playMode:0};
    const appearance={imageHeight:411,crop:'center'};
    function load(s){if(!s)return;if(presets.some(t=>t.id===s.themeId))p.themeId=s.themeId;p.track=Number.isInteger(s.track)&&s.track>=0&&s.track<trackData.length?s.track:0;p.position=Number.isFinite(s.position)?Math.max(0,Math.min(duration(p),s.position)):91;p.playing=s.playing!==false;p.playerLyrics=s.playerLyrics===true;p.playMode=[0,1,2].includes(s.playMode)?s.playMode:0;p.screen=s.screen==='library'?'library':'player';}
    function draw(){const t=getTheme(p.themeId);device.setAttribute('style',themeStyle(t));device.style.setProperty('--xy-image-position',appearance.crop==='left'?'25% 40%':appearance.crop==='right'?'80% 40%':'60% 40%');device.style.setProperty('--xy-cover-height',appearance.imageHeight+'px');content.innerHTML=p.screen==='player'?playerPage(t,'cover',p):`${topbar('曲库','player')}<main class="xy-page xy-home">${libraryHero(t)}${groups()}${tracks(4)}<button type="button" class="xy-open-player cursor-interaction" data-action="player" aria-label="返回播放页">${mini(p)}</button></main>`;sheet.innerHTML='';refreshIcons();}
    function saveCover(){coverSnapshot={...p};persist();}
    target.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
      if(action==='toggle-play'){togglePlayback(target,p);saveCover();return;}
      if(action==='next'||action==='previous'){p.track=(p.track+(action==='next'?1:trackData.length-1))%trackData.length;p.position=0;draw();saveCover();return;}
      if(action==='play-mode'){p.playMode=(p.playMode+1)%modes.length;draw();saveCover();return;}
      if(action==='player-view'){p.playerLyrics=el.dataset.value==='lyrics';draw();saveCover();return;}
      if(action==='queue'||action==='quick-themes'||action==='cast'){sheet.innerHTML=playerSheet(action==='quick-themes'?'themes':action,getTheme(p.themeId),p,false);refreshIcons();sheet.querySelector('button')?.focus();return;}
      if(action==='quick-apply'){p.themeId=el.dataset.id;draw();saveCover();return;}
      if(action==='queue-track'){p.track=Number(el.dataset.index);p.position=0;draw();saveCover();return;}
      if(action==='close-sheet'){if(event.target.closest('.xy-bottom-sheet')&&!event.target.closest('button'))return;sheet.innerHTML='';return;}
      if(action==='library'||action==='player'){p.screen=action;draw();saveCover();}
    });
    target.addEventListener('input',event=>{if(event.target.classList.contains('xy-player-seek'))updateSeek(event.target,p,target);});
    target.addEventListener('change',event=>{if(event.target.classList.contains('xy-player-seek'))saveCover();});
    target.addEventListener('keydown',event=>{if(event.key==='Escape')sheet.innerHTML='';});
    window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent?.coverPlayer;if(s){coverSnapshot=s;load(s);draw();}});
    load(coverSnapshot);draw();
    if(globalThis.Tweak){const tweak=new Tweak({container:device,onChange:draw});tweak.addSlider(appearance,'imageHeight',{label:'封面高度',min:350,max:450,unit:'px',reference:'--xy-cover-height'});tweak.addSelect(appearance,'crop',{label:'封面焦点',options:[{label:'偏左',value:'left'},{label:'居中',value:'center'},{label:'偏右',value:'right'}]});}
  }
  function sidebarActions(t,interactive=false){return [['cast','Mac 实时歌词','连接同一网络中的 Mac','unavailable'],['archive','导入音乐','导入本地音乐压缩包','unavailable'],['refresh-cw','重新扫描','重新读取音乐目录','unavailable'],['palette','外观与主题',t.name,'manager']].map(([i,title,sub,a],n)=>`<${interactive?'button':'div'} ${interactive?'type="button"':''} class="xy-drawer-action ${n===3?'xy-accent':''} ${interactive?'cursor-interaction':''}" ${interactive?`data-action="${a}"`:''}>${icon(i)}<span><strong>${title}</strong><small>${escape(sub)}</small></span></${interactive?'button':'div'}>`).join('');}

  function colorsPanel(){const t=state.draft;return `<div>${[['accent','主题色','按钮、进度条、当前歌词'],['bg','页面底色','曲库与播放页面的基础颜色'],['panel','面板颜色','分组、迷你播放器、输入框']].map(([key,label,desc])=>`<div class="xy-color-row"><div><strong>${label}</strong><small>${desc}</small></div><div class="xy-color-control"><code id="xy-code-${key}">${t[key]}</code><input type="color" value="${t[key]}" data-color="${key}" aria-label="${label}" class="cursor-interaction"></div></div>`).join('')}<div class="xy-color-row"><div><strong>文字颜色</strong><small>随底色自动调整深浅</small></div><span class="xy-auto">${icon('check')} 自动适配</span></div></div>`;}
  function backgroundsPanel(){const t=state.draft;return `<div class="xy-places" aria-label="背景应用位置">${Object.entries(placeNames).map(([key,label])=>`<button class="xy-place cursor-interaction" type="button" data-action="place" data-value="${key}" aria-pressed="${state.place===key}">${label}</button>`).join('')}</div><div class="xy-background-choices">${[['none','纯色'],['portrait','原初'],['mountain','山色'],['stage','演出']].map(([key,label])=>`<button class="xy-bg-choice cursor-interaction" type="button" data-action="background" data-value="${key}" aria-label="${label}背景" aria-pressed="${t[state.place]===key}">${key==='none'?'<span>纯色</span>':imageTag(key,'',label)}</button>`).join('')}</div><p class="xy-bg-caption">可为每个位置单独选图，也可保留纯色。</p><button type="button" class="xy-upload cursor-interaction" data-action="local-image">${icon('image-plus')}从相册选择图片</button><input type="file" accept="image/*" id="xy-local-image" hidden><p class="xy-tiny-note">当前：${placeNames[state.place]}${t[state.place]?.startsWith('upload-')?' · 已选择本地图片':''}</p>`;}
  function effectsPanel(){const t=state.draft;return `<div class="xy-range-row"><div class="xy-row"><label for="xy-mask">背景遮罩</label><output id="xy-mask-out">${t.mask}%</output></div><input type="range" id="xy-mask" min="40" max="100" step="1" value="${t.mask}" data-range="mask"><p class="xy-tiny-note">数值越高，背景越淡，文字越清楚。</p></div><div class="xy-range-row"><div class="xy-row"><label for="xy-blur">背景模糊</label><output id="xy-blur-out">${t.blur}</output></div><input type="range" id="xy-blur" min="0" max="12" value="${t.blur}" data-range="blur"></div><div class="xy-color-row"><div><strong>图片焦点</strong><small>调整人物或画面的展示位置</small></div><select class="xy-select" id="xy-position" aria-label="图片焦点">${[['left','偏左'],['center','居中'],['right','偏右']].map(([key,label])=>`<option value="${key}" ${t.position===key?'selected':''}>${label}</option>`).join('')}</select></div>`;}
  function editor(){return topbar(state.editId?'编辑主题':'自定义主题','cancel-edit',`<button type="button" class="xy-text-button cursor-interaction" data-action="save">保存</button>`)+`<main class="xy-page"><label class="xy-form-label" for="xy-theme-name">主题名称</label><input class="xy-name" id="xy-theme-name" type="text" maxlength="20" value="${escape(state.draft.name)}" placeholder="给这套主题起个名字"><div id="xy-editor-live">${editorPreview()}</div><div class="xy-tabs xy-editor-tabs" role="tablist" aria-label="主题编辑项">${[['colors','配色'],['backgrounds','背景'],['effects','效果']].map(([key,label])=>`<button class="xy-tab cursor-interaction" type="button" role="tab" id="xy-edit-${key}" aria-controls="xy-editor-panel" aria-selected="${state.editTab===key}" data-action="edit-tab" data-value="${key}">${label}</button>`).join('')}</div><div class="xy-editor-panel" id="xy-editor-panel" role="tabpanel" aria-labelledby="xy-edit-${state.editTab}">${state.editTab==='colors'?colorsPanel():state.editTab==='backgrounds'?backgroundsPanel():effectsPanel()}</div><div class="xy-actions">${button('save','仅保存')}${button('save-apply','保存并应用','xy-primary')}</div></main>`;}
  function home(){const t=activeTheme();return `<main class="xy-page xy-home">${libraryHero(t,true)}${groups()}${tracks(4)}<button type="button" class="xy-open-player cursor-interaction" data-action="player" aria-label="打开播放页">${mini()}</button></main>`;}
  function refreshIcons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
  function render(animate=false){phone.setAttribute('style',themeStyle(activeTheme()));view.innerHTML=state.screen==='player'?playerPage():state.screen==='manager'?manager():state.screen==='preview'?preview():state.screen==='editor'?editor():home();if(animate)view.querySelector('.xy-page,.xy-now')?.classList.add('xy-enter');overlay.innerHTML='';refreshLiveStyle();refreshIcons();state.first=false;}
  function refreshLiveStyle(){const t=state.screen==='editor'?state.draft:null;if(!t)return;const el=root.querySelector('#xy-edit-preview');if(!el)return;el.setAttribute('style',themeStyle(t));el.querySelectorAll('img').forEach(img=>{if(!img.closest('.xy-track')){img.style.objectPosition=t.position==='left'?'25% 40%':t.position==='right'?'80% 40%':'60% 40%';if(img.closest('.xy-library-hero,.xy-dialog-art'))img.style.filter=`blur(${t.blur}px)`;}});const hero=el.querySelector('.xy-library-hero');if(hero)hero.style.setProperty('--xy-mask',t.mask/100);}
  function updateEditorPreview(){const live=root.querySelector('#xy-editor-live');if(live){live.innerHTML=editorPreview();refreshLiveStyle();refreshIcons();}}
  function persist(){if(!window.openai?.setWidgetState)return;const serial=state.custom.map(t=>{const c=clone(t);for(const k of ['header','player','sidebar','dialog'])if(c[k]?.startsWith('upload-'))c[k]='none';return c;});const saved={screen:state.screen==='editor'?'manager':state.screen,listTab:state.listTab,selected:state.selected,applied:state.applied,appliedSnapshot:state.appliedSnapshot,custom:serial,scene:state.scene,designVersion:2,track:state.track,position:state.position,playing:state.playing,playerLyrics:state.playerLyrics,playMode:state.playMode,coverPlayer:coverSnapshot};window.openai.setWidgetState({modelContent:{themeDesign:{activeTheme:getTheme(state.applied).name,selectedTheme:getTheme(state.selected).name,savedThemes:serial.map(t=>({name:t.name,accent:t.accent,background:t.bg})),previewScene:sceneNames[state.scene],playerLayout:'沉浸唱片',whitePresetRemoved:true,coverTheme:coverSnapshot?.themeId || 'paper'}},privateContent:saved}).catch(()=>{});}
  function restore(snapshot){const s=snapshot?.privateContent;if(!s||!Array.isArray(s.custom))return;state.custom=s.custom.filter(t=>typeof t.id==='string'&&typeof t.name==='string'&&['bg','panel','accent'].every(k=>/^#[0-9a-f]{6}$/i.test(t[k]))).map(t=>({...presets[0],...t,builtin:false,mask:Math.max(40,Math.min(100,Number(t.mask)||80)),blur:Math.max(0,Math.min(12,Number(t.blur)||0))}));if(allThemes().some(t=>t.id===s.applied))state.applied=s.applied;if(s.appliedSnapshot&&s.appliedSnapshot.id!=='plain'&&s.appliedSnapshot.id===state.applied&&['bg','panel','accent'].every(k=>/^#[0-9a-f]{6}$/i.test(s.appliedSnapshot[k])))state.appliedSnapshot=s.appliedSnapshot;if(allThemes().some(t=>t.id===s.selected))state.selected=s.selected;state.screen=s.designVersion===2&&['player','manager','preview','library'].includes(s.screen)?s.screen:'player';state.track=Number.isInteger(s.track)&&s.track>=0&&s.track<trackData.length?s.track:0;state.position=Math.max(0,Math.min(duration(state),Number.isFinite(s.position)?s.position:91));state.playing=s.playing!==false;state.playerLyrics=s.playerLyrics===true;state.playMode=[0,1,2].includes(s.playMode)?s.playMode:0;state.listTab=s.listTab==='mine'?'mine':'preset';state.scene=Object.hasOwn(sceneNames,s.scene)?s.scene:'library';}
  function navigate(screen){state.screen=screen;render(true);persist();}
  let toastTimer;
  function toast(message){const el=root.querySelector('#xy-toast');el.textContent=message;el.classList.add('xy-show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('xy-show'),2600);}
  function startEdit(id=null){const t=getTheme(id||state.applied);state.draft=clone(t);state.editId=id&&!t.builtin?id:null;state.draft.name=state.editId?t.name:'我的'+t.name.split(' · ')[1];state.draft.builtin=false;state.editTab='colors';state.place='header';state.screen='editor';render(true);}
  function save(apply=false){const name=root.querySelector('#xy-theme-name').value.trim();if(!name){toast('请先填写主题名称');root.querySelector('#xy-theme-name').focus();return;}const t=clone(state.draft);if(!apply&&state.editId===state.applied&&!state.appliedSnapshot)state.appliedSnapshot=clone(getTheme(state.applied));t.name=name;t.description='自定义配色与背景';t.id=state.editId||'custom-'+Date.now();t.builtin=false;const existing=state.custom.findIndex(x=>x.id===t.id);if(existing>=0)state.custom[existing]=t;else state.custom.push(t);state.selected=t.id;if(apply){state.applied=t.id;state.appliedSnapshot=clone(t);};state.draft=null;state.editId=null;state.listTab='mine';navigate('manager');toast(apply?'主题已保存并应用':'已保存到「我的主题」');}
  function showModal(type,id){state.dialog={type,id};const t=getTheme(id);let html='';if(type==='menu')html=`<h2>${escape(t.name)}</h2><div class="xy-modal-menu">${[['edit-saved','pencil','编辑主题'],['duplicate','copy','复制主题'],['rename','type','重命名'],['delete-confirm','trash-2','删除主题']].map(([a,i,l])=>`<button type="button" class="cursor-interaction ${a==='delete-confirm'?'xy-danger':''}" data-action="${a}" data-id="${t.id}">${icon(i)}${l}</button>`).join('')}</div>`;if(type==='rename')html=`<h2>重命名主题</h2><input class="xy-name" type="text" id="xy-rename-input" maxlength="20" aria-label="主题名称" value="${escape(t.name)}"><div class="xy-actions">${button('close-modal','取消')}${button('rename-save','保存','xy-primary')}</div>`;if(type==='delete')html=`<h2>删除这套主题？</h2><p>「${escape(t.name)}」将从我的主题中移除。${state.applied===id?'删除后会切回默认的原初 · 暖金。':''}</p><div class="xy-actions">${button('close-modal','取消')}${button('delete','删除','xy-primary')}</div>`;if(type==='discard')html=`<h2>保留这次调整吗？</h2><p>这次修改还没有保存。</p><div class="xy-actions">${button('keep-edit','继续编辑')}${button('discard-edit','放弃修改')}</div>`;overlay.innerHTML=`<div class="xy-modal-backdrop"><section class="xy-modal" role="dialog" aria-modal="true" aria-label="${type==='menu'?'管理主题':type==='rename'?'重命名主题':type==='delete'?'删除主题':'未保存的修改'}">${html}</section></div>`;refreshIcons();setTimeout(()=>overlay.querySelector('input,button')?.focus(),0);}
  root.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const id=el.dataset.id;const value=el.dataset.value;
    if(action==='toggle-play'){togglePlayback(root,state);persist();return;}
    if(action==='next'||action==='previous'){state.track=(state.track+(action==='next'?1:trackData.length-1))%trackData.length;state.position=0;render(true);persist();return;}
    if(action==='play-mode'){state.playMode=(state.playMode+1)%modes.length;render();persist();toast(modes[state.playMode].label);return;}
    if(action==='player-view'){state.playerLyrics=value==='lyrics';render(true);persist();return;}
    if(action==='queue'||action==='quick-themes'||action==='cast'){overlay.innerHTML=playerSheet(action==='quick-themes'?'themes':action);refreshIcons();overlay.querySelector('button')?.focus();return;}
    if(action==='close-sheet'){if(event.target.closest('.xy-bottom-sheet')&&!event.target.closest('button'))return;overlay.innerHTML='';return;}
    if(action==='quick-apply'){state.applied=id;state.appliedSnapshot=clone(getTheme(id));render();persist();toast('已应用「'+getTheme(id).name+'」');return;}
    if(action==='queue-track'){state.track=Number(el.dataset.index);state.position=0;render(true);persist();return;}
    if(action==='manager'||action==='library'||action==='player'){navigate(action);return;}
    if(action==='list-tab'){state.listTab=value;render();persist();return;}
    if(action==='open'){state.selected=id;state.scene='library';navigate('preview');return;}
    if(action==='scene'){state.scene=value;render();persist();return;}
    if(action==='apply'){state.applied=state.selected;state.appliedSnapshot=clone(getTheme(state.selected));render();persist();toast('已应用「'+getTheme(state.applied).name+'」');return;}
    if(action==='new'){startEdit();return;}
    if(action==='customize'||action==='edit'){startEdit(state.selected);return;}
    if(action==='edit-tab'){state.draft.name=root.querySelector('#xy-theme-name').value;state.editTab=value;render();return;}
    if(action==='place'){state.draft.name=root.querySelector('#xy-theme-name').value;state.place=value;render();return;}
    if(action==='background'){state.draft[state.place]=value;state.draft.name=root.querySelector('#xy-theme-name').value;render();return;}
    if(action==='local-image'){root.querySelector('#xy-local-image').click();return;}
    if(action==='save'||action==='save-apply'){save(action==='save-apply');return;}
    if(action==='cancel-edit'){showModal('discard',state.selected);return;}
    if(action==='discard-edit'){state.draft=null;state.editId=null;navigate('manager');return;}
    if(action==='close-modal'||action==='keep-edit'){overlay.innerHTML='';state.dialog=null;return;}
    if(action==='theme-menu'){showModal('menu',id);return;}
    if(action==='edit-saved'){state.selected=id;startEdit(id);return;}
    if(action==='rename'){showModal('rename',id);return;}
    if(action==='rename-save'){const name=root.querySelector('#xy-rename-input').value.trim();if(!name){toast('请填写主题名称');return;}getTheme(state.dialog.id).name=name;if(state.appliedSnapshot?.id===state.dialog.id)state.appliedSnapshot.name=name;render();persist();toast('主题已重命名');return;}
    if(action==='duplicate'){const t=clone(getTheme(id));t.id='custom-'+Date.now();t.name=(t.name.slice(0,16)+' 副本');state.custom.push(t);render();persist();toast('已复制主题');return;}
    if(action==='delete-confirm'){showModal('delete',id);return;}
    if(action==='delete'){const deleteId=state.dialog.id;state.custom=state.custom.filter(t=>t.id!==deleteId);if(state.applied===deleteId){state.applied='paper';state.appliedSnapshot=null;}if(state.selected===deleteId)state.selected=state.applied;render();persist();toast('主题已删除');return;}
    if(action==='drawer'){const t=activeTheme();overlay.innerHTML=`<div class="xy-scrim" data-action="close-drawer"><aside class="xy-drawer" aria-label="功能侧边栏">${artBackdrop(t,'sidebar')}<div class="xy-drawer-close">${iconButton('close-drawer','x','关闭侧边栏')}</div>${sidebarActions(t,true)}</aside></div>`;refreshIcons();return;}
    if(action==='close-drawer'){if(event.target.closest('.xy-drawer')&&!event.target.closest('button'))return;overlay.innerHTML='';return;}
    if(action==='unavailable'){toast('这里展示主题效果');}
  });
  root.addEventListener('input',event=>{const el=event.target;if(el.classList.contains('xy-player-seek')){updateSeek(el,state,root);return;}if(el.id==='xy-theme-name'){state.draft.name=el.value;return;}if(el.dataset.color){state.draft[el.dataset.color]=el.value;root.querySelector('#xy-code-'+el.dataset.color).textContent=el.value.toUpperCase();updateEditorPreview();return;}if(el.dataset.range){state.draft[el.dataset.range]=Number(el.value);root.querySelector('#xy-'+el.dataset.range+'-out').textContent=el.value+(el.dataset.range==='mask'?'%':'');updateEditorPreview();}});
  root.addEventListener('change',event=>{const el=event.target;if(el.id==='xy-position'){state.draft.position=el.value;updateEditorPreview();}if(el.id==='xy-local-image'&&el.files?.[0]){const file=el.files[0];if(!file.type.startsWith('image/')){toast('请选择图片文件');return;}const place=state.place;const draft=state.draft;const reader=new FileReader();reader.onload=()=>{if(state.draft!==draft)return;const key='upload-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);assets[key]=reader.result;draft[place]=key;draft.name=root.querySelector('#xy-theme-name').value;render();toast('已替换'+placeNames[place]+'背景');};reader.readAsDataURL(file);}});
  root.addEventListener('keydown',event=>{const tab=event.target.closest('[role=tab]');if(tab&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const tabs=[...tab.parentElement.querySelectorAll('[role=tab]')];const next=tabs[(tabs.indexOf(tab)+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length];const action=next.dataset.action;const value=next.dataset.value;next.click();root.querySelector(`[data-action="${action}"][data-value="${value}"]`)?.focus();}if(event.key==='Escape'&&overlay.innerHTML){overlay.innerHTML='';state.dialog=null;}});
  root.addEventListener('change',event=>{if(event.target.classList.contains('xy-player-seek'))persist();});
  restore(window.openai?.widgetState);
  render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{root.style.setProperty('--xy-radius',design.radius+'px');root.style.setProperty('--xy-button-radius',design.buttonRadius+'px');}});tweak.addSlider(design,'radius',{label:'预览圆角',min:0,max:24,unit:'px',reference:'--xy-radius'});tweak.addSlider(design,'buttonRadius',{label:'按钮圆角',min:0,max:24,unit:'px',reference:'--xy-button-radius'});}
  mountCoverVariant();
})();
</script>
